name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        id: package
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version $package_version does not match release tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Check npm registry
        id: registry
        shell: bash
        run: |
          if npm view "@notificator-project/astro@${{ steps.package.outputs.version }}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.package.outputs.version }} is already available on npm."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run check

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance

      - name: Confirm existing package
        if: steps.registry.outputs.published == 'true'
        run: echo "Skipping npm publish because this version is already public."
